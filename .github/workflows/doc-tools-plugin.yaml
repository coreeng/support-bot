---
name: doc-tools plugin checks

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'plugins/doc-tools/**'
      - '.claude-plugin/**'
      - '.github/workflows/doc-tools-plugin.yaml'
  pull_request:
    branches:
      - main
    paths:
      - 'plugins/doc-tools/**'
      - '.claude-plugin/**'
      - '.github/workflows/doc-tools-plugin.yaml'

permissions:
  contents: read

jobs:
  check:
    name: agnostic + layout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Denylist — nothing consumer- or estate-specific in the plugin
        run: plugins/doc-tools/scripts/check-agnostic.sh

      - name: Layout — skill-relative paths resolve, agent prompts match, manifests and frontmatter valid
        run: plugins/doc-tools/scripts/check-layout.sh

      - name: Agent Skills spec — gh skill publish dry run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh skill --help >/dev/null 2>&1; then
            gh skill publish --dry-run .
          else
            echo "gh skill not available in this gh version; skipping"
          fi
