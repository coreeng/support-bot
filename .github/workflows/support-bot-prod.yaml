---
name: support-bot Prod

on:
  workflow_dispatch:
#  schedule:
#    - cron: '30 5 * * 1-5'

permissions:
  packages: write
  contents: read
  id-token: write

jobs:
  get-latest-version:
    uses: coreeng/p2p/.github/workflows/p2p-get-latest-image-prod.yaml@v1
    secrets:
      slack_webhook_url: ${{ secrets.P2P_SLACK_WEBHOOK_URL }}
    with:
      image-name: support-bot
      tenant-name: support-bot

  prod:
    needs: [get-latest-version]
    # Prod publishes images and the chart for one shared support-bot-prod
    # target; two dispatches must run one after the other, never cancelled
    # half-way through a publish.
    concurrency:
      group: p2p-prod-support-bot
      cancel-in-progress: false
    uses: coreeng/p2p/.github/workflows/p2p-workflow-prod.yaml@v1
    secrets:
      slack_webhook_url: ${{ secrets.P2P_SLACK_WEBHOOK_URL }}
      env_vars: ${{ secrets.env_vars }}
    with:
      app-name: support-bot
      tenant-name: support-bot
      version: ${{ needs.get-latest-version.outputs.version }}
      version-prefix: v
      working-directory: ./
