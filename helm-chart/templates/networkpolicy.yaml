{{- if .Values.internalPort.enabled }}
{{- if empty .Values.internalPort.allowedFrom }}
{{- fail "internalPort.allowedFrom must list at least one NetworkPolicy peer when internalPort.enabled is true" }}
{{- end }}
{{- if ne .Values.service.type "ClusterIP" }}
{{- fail "service.type must be ClusterIP when internalPort.enabled is true, or the internal port is published outside the cluster" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "support-bot.fullname" . }}-internal-port
  labels:
    {{- include "support-bot.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "support-bot.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: {{ .Values.service.port }}
          protocol: TCP
        # The management port serves probes and metrics whether or not the metrics Service port is exposed.
        - port: {{ .Values.metrics.port }}
          protocol: TCP
    - from:
        {{- toYaml .Values.internalPort.allowedFrom | nindent 8 }}
      ports:
        - port: {{ .Values.internalPort.port }}
          protocol: TCP
{{- end }}
