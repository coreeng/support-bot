suite: api deployment
templates:
  - templates/deployment.yaml
tests:
  - it: reports the chart app version when the image tag is empty
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SUPPORT_BOT_VERSION
            value: "1.0.0"

  - it: reports the deployed image tag to Elevate by default
    set:
      image.tag: "v0.0.220"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SUPPORT_BOT_VERSION
            value: "v0.0.220"

  - it: permits an explicit reported version override
    set:
      image.tag: "sha-abc123"
      supportBotVersion: "v0.0.220"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SUPPORT_BOT_VERSION
            value: "v0.0.220"

  - it: preserves an explicit SUPPORT_BOT_VERSION environment entry
    set:
      image.tag: "sha-abc123"
      env:
        - name: SUPPORT_BOT_VERSION
          value: "operator-version"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SUPPORT_BOT_VERSION
            value: "operator-version"

  - it: appends UI_ORIGIN when publicWebOrigin is set
    set:
      publicWebOrigin: "https://support-bot.example"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: UI_ORIGIN
            value: "https://support-bot.example"

  - it: mounts the analysis bundle when enabled
    set:
      analysisBundle.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SUMMARY_DATA_ANALYSIS_BUNDLE_PATH
            value: /app/analysis.zip
      - contains:
          path: spec.template.spec.volumes
          content:
            name: analysis-bundle
            configMap:
              name: analysis-bundle

  - it: mounts the config volume by default
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: config
            mountPath: /app/config

  - it: omits the config volume when disabled
    set:
      configMap.enabled: false
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: config
            mountPath: /app/config

  - it: omits dex checksum annotations when dex.enabled is false
    asserts:
      - notExists:
          path: spec.template.metadata.annotations["checksum/dex-config"]
      - notExists:
          path: spec.template.metadata.annotations["checksum/dex-client"]
